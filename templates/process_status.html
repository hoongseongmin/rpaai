<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPA/AI 자동화 플랫폼 - 처리/미처리 현황</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .summary-box {
            border: 1px solid #ddd;
            padding: 15px 20px;
            margin-top: 20px;
            border-radius: 6px;
            background-color: #f9f9f9;
        }
        .summary-box h4 {
            margin-top: 0;
            font-size: 1.1em;
        }
        .summary-box h5 {
            margin-top: 20px;
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .preview-table-container {
            max-height: 250px;
            overflow-y: auto;
            overflow-x: auto;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            max-width: 100%;
        }
        .preview-table-container table {
            width: max-content; /* 내용물 길이에 맞춰 무한히 늘어나게 하여 스크롤 유도 */
            min-width: 100%;    /* 내용물이 적을 때도 최소한 표가 꽉 차도록 유지 */
            border-collapse: collapse;
            font-size: 0.9em;
        }
        .preview-table-container th, .preview-table-container td {
            border-bottom: 1px solid #ddd;
            padding: 8px 10px;
            text-align: left;
            white-space: nowrap;
        }
        .preview-table-container thead th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        .preview-table-container tbody tr:hover {
            background-color: #f5f5f5;
            cursor: pointer;
        }
        .preview-table-container tbody tr.selected-row td {
            background-color: #e3f2fd; /* 옅은 파란색으로 선택 표시 */
        }
        .preview-table-container tbody tr.selected-row td:first-child {
            /* 선택된 행의 시작을 굵은 파란색 선으로 강조 */
            box-shadow: inset 3px 0 0 0 var(--primary);
        }
        
        /* 복사 완료 알림 팝업(Toast) 스타일 */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 12px 20px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        {% set active_page = 'process_status' %}
        {% include 'header.html' %}

        <!-- 메인 콘텐츠 -->
        <main class="main">
            <!-- 파일 업로드 섹션 -->
            <section class="card">
                <h2>📁 파일 업로드</h2>
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="file-drop-area" id="dropArea">
                        <span class="file-msg">파일을 드래그하거나 클릭하여 선택</span>
                        <input type="file" id="fileInput" name="files" multiple accept="*/*">
                    </div>
                    <!-- 업로드 버튼 직전에 선택된 파일들이 표시될 영역 -->
                    <div id="selectedFiles" class="file-list" style="margin-bottom: 15px;"></div>
                    <button type="submit" class="btn btn-primary">업로드</button>
                </form>
                <div id="uploadResult" class="result"></div>
            </section>

            <!-- 업로드된 파일 목록 -->
            <section class="card">
                <h2>📂 업로드된 파일</h2>
                <div id="uploadedFiles" class="file-grid"></div>
            </section>

            <!-- 파일 처리 섹션 -->
            <section class="card">
                <h2>⚙️ 처리/미처리현황 편집</h2>
                <form id="processForm">
                    <!-- 작업 유형 고정 -->
                    <input type="hidden" id="operation" name="operation" value="process_status">

                    <!-- 처리/미처리 현황 옵션 -->
                    <div id="statusOptions" class="options" style="display:block;">
                        <div class="form-group">
                            <p style="color: var(--text-light); margin-bottom: 10px;">※ '처리미처리현황' 엑셀 파일을 위 목록에서 체크한 후 실행하세요.</p>
                            <div style="display: flex; gap: 10px;">
                                <div style="flex: 1;">
                                    <label>시작일:</label>
                                    <input type="date" id="status_start_date" name="start_date" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                                </div>
                                <div style="flex: 1;">
                                    <label>종료일:</label>
                                    <input type="date" id="status_end_date" name="end_date" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                                </div>
                            </div>
                            <div id="holidayPreviewContainer" style="margin-top: 15px; display: none; background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; padding: 15px;">
                                <h5 style="margin-top: 0; margin-bottom: 10px; color: var(--primary);">📅 필터링 대상 휴일 목록 미리보기</h5>
                                <div id="holidayPreviewList" style="display: flex; flex-wrap: wrap; gap: 8px; max-height: 150px; overflow-y: auto;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 일반 파일 선택 (비교 외 작업용) -->
                    <div class="form-group" id="genericFileSelectGroup" style="display:block;">
                        <label>처리할 파일 선택 (서버에 업로드된 파일):</label>
                        <div id="serverFileList" class="file-list" style="border: 1px solid var(--border); padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto;">
                            <p style="color: var(--text-light); font-size: 0.9em;">업로드된 파일이 없습니다.</p>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">처리 실행</button>
                </form>
                <div id="processResult" class="result"></div>
            </section>

        </main>

        <!-- 푸터 -->
        <footer class="footer">
            <p>RPA/AI 자동화 플랫폼 v1.0.0</p>
        </footer>
    </div>

    <script>
        // 파일 드래그 앤 드롭
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        
        // 파일을 누적하기 위한 DataTransfer 객체 생성
        let accumulatedFiles = new DataTransfer();

        dropArea.addEventListener('click', () => fileInput.click());

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });

        dropArea.addEventListener('dragleave', () => {
            dropArea.classList.remove('dragover');
        });

        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            handleNewFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleNewFiles(e.target.files);
        });

        // 새 파일이 추가될 때마다 기존 목록에 누적하는 함수
        function handleNewFiles(newFiles) {
            for (let i = 0; i < newFiles.length; i++) {
                // 동일한 이름과 크기를 가진 파일은 중복으로 간주하여 제외
                const isDuplicate = Array.from(accumulatedFiles.files).some(
                    f => f.name === newFiles[i].name && f.size === newFiles[i].size
                );
                
                if (!isDuplicate) {
                    accumulatedFiles.items.add(newFiles[i]);
                }
            }
            // input 태그의 실제 파일 목록을 누적된 파일들로 교체
            fileInput.files = accumulatedFiles.files;
            updateFileList();
        }

        function updateFileList() {
            const files = fileInput.files;
            const selectedFiles = document.getElementById('selectedFiles');
            
            selectedFiles.innerHTML = '';
            
            for (let i = 0; i < files.length; i++) {
                const fileText = files[i].name + ' (' + formatSize(files[i].size) + ')';
                
                const item2 = document.createElement('div');
                item2.className = 'file-item';
                item2.textContent = fileText;
                selectedFiles.appendChild(item2);
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // 💡 휴일 미리보기 업데이트 함수
        async function updateHolidayPreview() {
            const startDate = document.getElementById('status_start_date').value;
            const endDate = document.getElementById('status_end_date').value;
            const container = document.getElementById('holidayPreviewContainer');
            const listDiv = document.getElementById('holidayPreviewList');
            
            if (startDate && endDate) {
                if (startDate > endDate) {
                    listDiv.innerHTML = '<span style="color: #ef4444;">시작일이 종료일보다 클 수 없습니다.</span>';
                    container.style.display = 'block';
                    return;
                }
                
                container.style.display = 'block';
                listDiv.innerHTML = '<span style="color: #888;">달력을 불러오는 중...</span>';
                
                try {
                    const response = await fetch(`/files/holidays?start_date=${startDate}&end_date=${endDate}`);
                    const data = await response.json();
                    
                    if (data.success && data.holidays.length > 0) {
                        listDiv.innerHTML = data.holidays.map(h => {
                            const color = h.is_weekend ? '#64748b' : '#ef4444'; // 주말:회색, 공휴일:빨간색
                            const bg = h.is_weekend ? '#f8fafc' : '#fef2f2';
                            const border = h.is_weekend ? '#cbd5e1' : '#fca5a5';
                            return `<span style="padding: 4px 8px; border-radius: 4px; background: ${bg}; color: ${color}; border: 1px solid ${border}; font-size: 0.85em; font-weight: bold;">${h.date} (${h.name})</span>`;
                        }).join('');
                    } else if (data.success) {
                        listDiv.innerHTML = '<span style="color: #888;">선택한 기간 내에 필터링될 주말이나 공휴일이 없습니다.</span>';
                    } else { listDiv.innerHTML = `<span style="color: #ef4444;">오류: ${data.detail}</span>`; }
                } catch (e) { listDiv.innerHTML = `<span style="color: #ef4444;">통신 오류가 발생했습니다.</span>`; }
            } else { container.style.display = 'none'; }
        }
        document.getElementById('status_start_date').addEventListener('change', updateHolidayPreview);
        document.getElementById('status_end_date').addEventListener('change', updateHolidayPreview);

        // 파일 업로드
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            formData.append('task_type', 'status');
            const resultDiv = document.getElementById('uploadResult');
            resultDiv.innerHTML = '업로드 중...';

            try {
                const response = await fetch('/files/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                resultDiv.innerHTML = `<div class="success">${data.message}</div>`;
                
                // 업로드 성공 후 선택된 파일 목록(큐) 초기화
                accumulatedFiles = new DataTransfer();
                fileInput.files = accumulatedFiles.files;
                updateFileList();

                loadUploadedFiles();
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">오류: ${error.message}</div>`;
            }
        });

        // 파일 처리
        document.getElementById('processForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            const operation = document.getElementById('operation').value;
            
            if (!operation) {
                alert('수행할 작업을 먼저 선택해주세요.');
                return;
            }

            const selectedCheckboxes = document.querySelectorAll('#serverFileList input[name="filenames"]:checked');
            if (selectedCheckboxes.length === 0) {
                alert('위의 목록에서 처리할 파일을 먼저 체크하여 선택해주세요!');
                return;
            }
            selectedCheckboxes.forEach(cb => {
                formData.append('filenames', cb.value);
            });

            // 옵션 수집
            let optionsObj = {};
            if (operation === 'process_status') {
                optionsObj.start_date = document.getElementById('status_start_date').value;
                optionsObj.end_date = document.getElementById('status_end_date').value;
                if (!optionsObj.start_date || !optionsObj.end_date) {
                    alert('처리할 기간의 시작일과 종료일을 모두 지정해주세요.');
                    return;
                }
            }

            const resultDiv = document.getElementById('processResult');
            resultDiv.innerHTML = '처리 중...';

            try {
                const response = await fetch(`/files/process?operation=${operation}&options=${encodeURIComponent(JSON.stringify(optionsObj))}`, {
                    method: 'POST',
                    body: formData
                });
                
                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    throw new Error(`서버에서 예기치 않은 오류가 발생했습니다: ${responseText}`);
                }
                
                if (response.ok && data.results && data.results.length > 0) {
                    let html = '<div class="success">처리 완료!</div>';
                    
                    data.results.forEach(r => {
                        const filename = r.output.split(/[/\\]/).pop();
                        let previewHtml = '';

                        // 비교 작업일 경우 미리보기 생성
                        if (r.summary && r.summary.message) {
                            previewHtml += `<div class="summary-box"><h4>✅ 처리 내역</h4><p>${r.summary.message}</p></div>`;
                        }

                        html += previewHtml;
                        html += `<a href="/files/download/${filename}" class="btn btn-success" style="margin-top: 15px;">${filename} 다운로드</a>`;
                    });
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div class="${response.ok ? 'success' : 'error'}">${data.message || data.detail}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">오류: ${error.message}</div>`;
            }
        });

        // 업로드된 파일 목록 로드
        async function loadUploadedFiles() {
            try {
                const response = await fetch('/files?task_type=status');
                const data = await response.json();
                
                const fileGrid = document.getElementById('uploadedFiles');
                const serverFileList = document.getElementById('serverFileList');
                
                if (data.files && data.files.length > 0) {
                    fileGrid.innerHTML = data.files.map(f => `
                        <div class="file-card" style="position: relative;">
                            <button onclick="deleteFile('${f.name}')" style="position: absolute; top: 5px; right: 5px; background: none; border: none; cursor: pointer; font-size: 14px; color: #dc3545;" title="삭제">✖</button>
                            <div class="file-icon">📄</div>
                            <div class="file-name">${f.name}</div>
                            <div class="file-size">${formatSize(f.size)}</div>
                        </div>
                    `).join('');
                    
                    serverFileList.innerHTML = data.files.map(f => `
                        <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 5px; cursor: pointer; padding: 5px; background: var(--bg); border-radius: 4px;">
                            <input type="checkbox" name="filenames" value="${f.name}">
                            📄 ${f.name} <span class="file-size" style="color:var(--text-light); font-size:0.8em;">(${formatSize(f.size)})</span>
                        </label>
                    `).join('');
                } else {
                    fileGrid.innerHTML = '<p>업로드된 파일이 없습니다.</p>';
                    serverFileList.innerHTML = '<p style="color: var(--text-light); font-size: 0.9em;">업로드된 파일이 없습니다.</p>';
                }
            } catch (error) {
                console.error('파일 목록 로드 오류:', error);
            }
        }

        // 파일 삭제 로직
        async function deleteFile(filename) {
            if (!confirm(`'${filename}' 파일을 삭제하시겠습니까?`)) {
                return;
            }
            try {
                const response = await fetch(`/files/${filename}?task_type=status`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (response.ok) {
                    loadUploadedFiles(); // 삭제 성공 시 파일 목록 즉시 새로고침
                } else {
                    alert('오류: ' + (data.detail || data.message));
                }
            } catch (error) {
                console.error('파일 삭제 오류:', error);
                alert('파일 삭제 중 오류가 발생했습니다.');
            }
        }

        // 초기 로드
        loadUploadedFiles();

        // 미리보기 표 검색 버튼 클릭 필터링 함수
        function filterPreviewTables(buttonElem) {
            const inputElem = buttonElem.previousElementSibling;
            const term = inputElem.value.toLowerCase();
            // 현재 검색 버튼이 속한 요약 박스 안의 모든 데이터 행(tbody tr)을 찾음
            const summaryBox = buttonElem.closest('.summary-box');
            const rows = summaryBox.querySelectorAll('.preview-table-container tbody tr');
            
            rows.forEach(row => {
                const rowText = row.textContent.toLowerCase();
                row.style.display = rowText.includes(term) ? '' : 'none'; // 검색어 포함 여부에 따라 표시/숨김
            });
        }
    </script>
    <script src="/static/js/common.js"></script>
</body>
</html>
