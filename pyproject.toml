[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rpaai"
version = "0.1.0"
description = "RPA AI 자동화 프로젝트"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    # 필요한 패키지들을 여기에 추가하세요 (예: "requests", "selenium" 등)
]

[project.optional-dependencies]
test = [
    "pytest",
]